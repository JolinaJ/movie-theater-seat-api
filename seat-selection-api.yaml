openapi: 3.0.3
info:
  title: Seat Selection API
  version: 1.0.0
  description: >-
    Lets a movie theater customer see which seats are open for a showtime,
    hold the seats they pick for 10 minutes while they pay, and release a
    hold so the seats go back on sale.

paths:
  /showtimes/{showtimeId}/seats:
    get:
      summary: Get the seat map for a showtime
      parameters:
        - name: showtimeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The seat map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seats:
                    type: array
                    items:
                      type: object
                      properties:
                        seatId:
                          type: string
                        status:
                          type: string
                          enum: [AVAILABLE, HELD, SOLD]
        '404':
          description: Showtime not found.

  /showtimes/{showtimeId}/seat-holds:
    post:
      summary: Hold seats for 10 minutes
      parameters:
        - name: showtimeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seatIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Seats held.
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  totalCents:
                    type: integer
        '409':
          description: A seat is already taken.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unavailableSeats:
                    type: array
                    items:
                      type: string

  /seat-holds/{holdId}:
    delete:
      summary: Release a seat hold
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Hold released.
        '404':
          description: Hold not found.
        '409':
          description: Hold already paid for.
